[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "investimento-composto"
version = "0.1.0"
description = "Simulador de investimentos com FastAPI e Streamlit"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "streamlit>=1.40,<2",
  "httpx>=0.27,<1",
  "altair>=5,<7",
  "pandas>=2,<4",
  "reportlab>=4,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pypdf>=5,<7"]

[tool.setuptools.packages.find]
include = ["backend*", "frontend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
